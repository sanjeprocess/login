<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Portal · Aitken Spence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="portal">
  <header class="topbar">
    <div class="logo">
      <svg viewBox="0 0 20 24" width="16" height="20" aria-hidden="true">
        <polygon points="10,0 0,8 10,24 20,8" fill="#5BB8F5" />
        <polygon points="10,0 5,8 15,8" fill="#A9DBFF" />
        <polygon points="5,8 15,8 10,24" fill="#2E8FD8" />
      </svg>
      <span>Aitken Spence</span>
    </div>
    <div class="who">
      <div class="avatar" id="initials" aria-hidden="true"></div>
      <div class="who-text">
        <strong id="who-name"></strong>
        <span id="who-id"></span>
      </div>
      <button type="button" class="signout" id="btn-signout">Sign out</button>
    </div>
  </header>

  <main class="portal-main" id="main" hidden>
    <section class="portal-hero">
      <h1 id="greeting">Welcome</h1>
      <p class="lede">You're signed in. Your session ends in <b id="session-left">30:00</b>.</p>
    </section>

    <!-- Form goes here -->
    <section class="panel" id="form-slot">
      <div class="icon-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      </div>
      <h2>Your form</h2>
      <p class="sub">The form will appear here.</p>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
